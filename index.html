<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple daily task tracker for managing and organising your tasks.">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="task-tracker">
        <header class="app-header">
            <h1>Task Tracker</h1>
            <p>Organise your day, one task at a time.</p>
        </header>

        <section class="task-entry" aria-label="Add a new task">
            <form id="task-form">
                <label for="task-input">New task</label>
                <div class="task-entry-controls">
                    <input
                        type="text"
                        id="task-input"
                        name="task"
                        placeholder="What needs to be done?"
                        autocomplete="off"
                        required
                    >
                    <button type="submit">Add Task</button>
                </div>
            </form>
        </section>

        <section class="task-list-section" aria-label="Task list">
            <div class="task-toolbar">
                <div class="task-filters" role="group" aria-label="Filter tasks">
                    <button type="button" class="filter-button active" data-filter="all" aria-pressed="true">
                        All
                    </button>
                    <button type="button" class="filter-button" data-filter="pending" aria-pressed="false">
                        Pending
                    </button>
                    <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">
                        Completed
                    </button>
                </div>
                <p class="task-count" id="task-count" aria-live="polite">
                    <span id="task-count-number">0</span> tasks
                </p>
            </div>

            <ul id="task-list" class="task-list" aria-live="polite">
                <li class="empty-state">No tasks yet. Add your first task above.</li>
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
